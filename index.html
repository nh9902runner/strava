<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NH9902 Running Club - Bảng xếp hạng thành tích</title>
  <!-- Google Fonts Outfit & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Background decorative glows -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <!-- Header Section -->
    <header>
      <div class="logo-container">
        <div class="logo-nh"></div>
      </div>
      <h1 class="club-title">NH9902 Running Club</h1>
      <p class="club-subtitle">Bảng xếp hạng thành tích chạy bộ</p>
      <a href="https://www.strava.com/clubs/nh9902" target="_blank" class="strava-badge">
        <i class="fab fa-strava"></i> Xem Club trên Strava
      </a>
    </header>

    <!-- Configuration Box (Hidden by default, shown if API URL is not set) -->
    <div id="configBox" class="config-input-box" style="display: none;">
      <h3><i class="fas fa-cog"></i> Cấu hình Google Sheets API</h3>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
        Vui lòng dán link <strong>Web App URL</strong> sau khi Deploy Google Apps Script của bạn vào đây:
      </p>
      <input type="text" id="apiInput" placeholder="https://script.google.com/macros/s/.../exec">
      <button onclick="saveApiUrl()">Lưu cấu hình</button>
    </div>

    <!-- Active tabs selection -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tabThisWeek" onclick="switchTab('thisWeek')">
        <i class="fas fa-calendar-day"></i> Tuần Này
      </button>
      <button class="tab-btn" id="tabLastWeek" onclick="switchTab('lastWeek')">
        <i class="fas fa-history"></i> Tuần Trước
      </button>
    </div>

    <!-- Search Input -->
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm tên runner..." oninput="filterLeaderboard()">
    </div>

    <!-- Active Week Header / Info -->
    <div class="week-info-card" id="weekInfoCard" style="display: none;">
      <span class="week-label" id="weekHeaderLabel">Tuần từ ...</span>
      <span class="update-badge" id="updateBadge"><i class="fas fa-sync-alt"></i> Dữ liệu tự động</span>
    </div>

    <!-- Loading Spinner State -->
    <div class="state-container" id="loadingState">
      <div class="spinner"></div>
      <p>Đang tải bảng xếp hạng chạy bộ...</p>
    </div>

    <!-- Empty/Error State -->
    <div class="state-container" id="errorState" style="display: none;">
      <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff3d71;"></i>
      <p class="error-text" id="errorMsg">Đã xảy ra lỗi khi lấy dữ liệu bảng xếp hạng.</p>
      <button onclick="clearSavedConfig()" style="margin-top: 15px; background: rgba(255,255,255,0.1); border: 1px solid var(--panel-border); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
        Cấu hình lại API
      </button>
    </div>

    <!-- Main Leaderboard list -->
    <div class="leaderboard-list" id="leaderboardList">
      <!-- Generated dynamically by Javascript -->
    </div>
  </div>

  <script>
    // --- KHAI BÁO CẤU HÌNH API ---
    // Bạn có thể dán trực tiếp Web App URL vào đây để hardcode, hoặc nhập trực tiếp từ giao diện trang web.
    const DEFAULT_WEBAPP_URL = ""; 

    let webappUrl = DEFAULT_WEBAPP_URL || localStorage.getItem("nh9902_webapp_url") || "";
    let rawData = null;
    let currentActiveTab = "thisWeek"; // 'thisWeek' hoặc 'lastWeek'

    document.addEventListener("DOMContentLoaded", () => {
      if (!webappUrl) {
        document.getElementById("configBox").style.display = "block";
        document.getElementById("loadingState").style.display = "none";
      } else {
        fetchData();
      }
    });

    function saveApiUrl() {
      const inputVal = document.getElementById("apiInput").value.trim();
      if (inputVal.startsWith("https://script.google.com/")) {
        localStorage.setItem("nh9902_webapp_url", inputVal);
        webappUrl = inputVal;
        document.getElementById("configBox").style.display = "none";
        document.getElementById("loadingState").style.display = "flex";
        fetchData();
      } else {
        alert("Vui lòng nhập đúng địa chỉ Google Apps Script Web App URL!");
      }
    }

    function clearSavedConfig() {
      localStorage.removeItem("nh9902_webapp_url");
      location.reload();
    }

    async function fetchData() {
      try {
        const response = await fetch(webappUrl);
        if (!response.ok) throw new Error("Không thể kết nối đến máy chủ Google Sheets");
        
        rawData = await response.json();
        
        if (rawData.error) {
          throw new Error("Lỗi Apps Script: " + rawData.error);
        }
        
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("weekInfoCard").style.display = "flex";
        
        renderTab();
      } catch (error) {
        console.error(error);
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("errorState").style.display = "flex";
        document.getElementById("errorMsg").textContent = error.message;
      }
    }

    function switchTab(tab) {
      if (currentActiveTab === tab) return;
      currentActiveTab = tab;
      
      // Update UI active states
      document.getElementById("tabThisWeek").classList.toggle("active", tab === 'thisWeek');
      document.getElementById("tabLastWeek").classList.toggle("active", tab === 'lastWeek');
      
      renderTab();
    }

    function renderTab() {
      if (!rawData) return;
      
      const listContainer = document.getElementById("leaderboardList");
      listContainer.innerHTML = "";
      
      const listData = currentActiveTab === "thisWeek" ? rawData.thisWeek : rawData.lastWeek;
      const weekHeader = currentActiveTab === "thisWeek" ? rawData.thisWeekHeader : rawData.lastWeekHeader;
      
      // Update week label header
      document.getElementById("weekHeaderLabel").textContent = weekHeader || "Bảng xếp hạng";
      
      if (!listData || listData.length === 0) {
        listContainer.innerHTML = `
          <div class="state-container">
            <i class="fas fa-running" style="font-size: 40px; color: var(--text-muted); margin-bottom: 10px;"></i>
            <p style="color: var(--text-secondary);">Chưa có dữ liệu vận động viên cho tuần này.</p>
          </div>`;
        return;
      }
      
      filterLeaderboard();
    }

    function filterLeaderboard() {
      if (!rawData) return;
      
      const searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
      const listContainer = document.getElementById("leaderboardList");
      const listData = currentActiveTab === "thisWeek" ? rawData.thisWeek : rawData.lastWeek;
      
      listContainer.innerHTML = "";
      
      let renderedCount = 0;
      
      listData.forEach((runner, index) => {
        // Filter by name
        if (searchQuery && !runner.name.toLowerCase().includes(searchQuery)) {
          return;
        }
        
        renderedCount++;
        const rank = index + 1;
        
        // Progress Calculation
        let progressPct = 0;
        let progressClass = "none";
        if (runner.regKm > 0) {
          progressPct = Math.min(100, Math.round((runner.actKm / runner.regKm) * 100));
          progressClass = progressPct >= 100 ? "success" : "partial";
        } else if (runner.actKm > 0) {
          progressPct = 100; // No registration but active
          progressClass = "success";
        }
        
        // Fine / Note display
        let fineHtml = "";
        if (currentActiveTab === "lastWeek") {
          if (runner.note) {
            fineHtml = `<span class="fine-badge"><i class="fas fa-piggy-bank"></i> ${runner.note}</span>`;
          } else if (runner.regKm > 0 && runner.actKm >= runner.regKm) {
            fineHtml = `<span class="no-fine-badge"><i class="fas fa-check-circle"></i> Đạt mục tiêu</span>`;
          }
        }
        
        const card = document.createElement("div");
        card.className = `runner-card rank-${rank <= 3 ? rank : 'normal'}`;
        card.innerHTML = `
          <div class="runner-rank-info">
            <div class="rank-number">${rank}</div>
            <div class="runner-meta">
              <span class="runner-name">${runner.name}</span>
              <div class="goal-progress-container">
                <div class="progress-track">
                  <div class="progress-fill ${progressClass}" style="width: ${progressPct}%"></div>
                </div>
                <span class="progress-percentage">${progressPct}%</span>
              </div>
              ${fineHtml}
            </div>
          </div>
          <div class="runner-stats">
            <div class="stat-group">
              <span class="stat-label">Thực tế</span>
              <span class="stat-value highlight">${runner.actKm.toFixed(1)} <span style="font-size: 11px; font-weight: normal;">km</span></span>
            </div>
            <div class="stat-group">
              <span class="stat-label">Đăng ký</span>
              <span class="stat-value reg-val">${runner.regKm} <span style="font-size: 10px;">km</span></span>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
      
      if (renderedCount === 0) {
        listContainer.innerHTML = `
          <div class="state-container">
            <i class="fas fa-search" style="font-size: 30px; color: var(--text-muted); margin-bottom: 10px;"></i>
            <p style="color: var(--text-secondary);">Không tìm thấy runner nào khớp với từ khóa.</p>
          </div>`;
      }
    }
  </script>
</body>
</html>
