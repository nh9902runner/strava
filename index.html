<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NH9902 RUNNERS</title>
  <!-- Google Fonts Outfit & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/png" href="run.png">
</head>
<body>

  <!-- Background decorative glows -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <!-- Header Section -->
    <header>
      <div class="header-main-row">
        <img src="run.png" alt="Logo NH9902" class="logo-img">
        <h1 class="club-title">NH9902 Runners</h1>
      </div>
      <p class="club-subtitle">Bảng thành tích chạy bộ</p>

    </header>

    <!-- Configuration Box (Hidden by default, shown if API URL is not set) -->
    <div id="configBox" class="config-input-box" style="display: none;">
      <h3><i class="fas fa-cog"></i> Cấu hình Google Sheets API</h3>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
        Vui lòng dán link <strong>Web App URL</strong> sau khi Deploy Google Apps Script của bạn vào đây:
      </p>
      <input type="text" id="apiInput" placeholder="https://script.google.com/macros/s/.../exec">
      <button onclick="saveApiUrl()">Lưu cấu hình</button>
    </div>

    <!-- Active tabs selection -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tabThisWeek" onclick="switchTab('thisWeek')">
        <i class="fas fa-calendar-day"></i> Tuần Này
      </button>
      <button class="tab-btn" id="tabLastWeek" onclick="switchTab('lastWeek')">
        <i class="fas fa-history"></i> Tuần Trước
      </button>
    </div>

    <!-- Active Week Header / Info -->
    <div class="week-info-card" id="weekInfoCard" style="display: none;">
      <span class="week-label" id="weekHeaderLabel">Tuần từ ...</span>
      <span class="update-badge" id="updateBadge"></span>
    </div>

    <!-- Loading Spinner State -->
    <div class="state-container" id="loadingState">
      <div class="spinner"></div>
      <p>Đang tải bảng xếp hạng chạy bộ...</p>
    </div>

    <!-- Empty/Error State -->
    <div class="state-container" id="errorState" style="display: none;">
      <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff3d71;"></i>
      <p class="error-text" id="errorMsg">Đã xảy ra lỗi khi lấy dữ liệu bảng xếp hạng.</p>
      <button onclick="clearSavedConfig()" style="margin-top: 15px; background: rgba(255,255,255,0.1); border: 1px solid var(--panel-border); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
        Cấu hình lại API
      </button>
    </div>

    <!-- Main Leaderboard Table Container -->
    <div class="table-container" id="leaderboardTableContainer">
      <!-- Generated dynamically by Javascript -->
    </div>
  </div>

  <script>
    // --- KHAI BÁO CẤU HÌNH API ---
    // Bạn có thể dán trực tiếp Web App URL vào đây để hardcode, hoặc nhập trực tiếp từ giao diện trang web.
    const DEFAULT_WEBAPP_URL = ""; 

    let webappUrl = DEFAULT_WEBAPP_URL || localStorage.getItem("nh9902_webapp_url") || "";
    let rawData = null;
    let currentActiveTab = "thisWeek"; // 'thisWeek' hoặc 'lastWeek'

    document.addEventListener("DOMContentLoaded", () => {
      if (!webappUrl) {
        document.getElementById("configBox").style.display = "block";
        document.getElementById("loadingState").style.display = "none";
      } else {
        fetchData();
      }
    });

    function saveApiUrl() {
      const inputVal = document.getElementById("apiInput").value.trim();
      if (inputVal.startsWith("https://script.google.com/")) {
        localStorage.setItem("nh9902_webapp_url", inputVal);
        webappUrl = inputVal;
        document.getElementById("configBox").style.display = "none";
        document.getElementById("loadingState").style.display = "flex";
        fetchData();
      } else {
        alert("Vui lòng nhập đúng địa chỉ Google Apps Script Web App URL!");
      }
    }

    function clearSavedConfig() {
      localStorage.removeItem("nh9902_webapp_url");
      location.reload();
    }

    async function fetchData() {
      try {
        const response = await fetch(webappUrl);
        if (!response.ok) throw new Error("Không thể kết nối đến máy chủ Google Sheets");
        
        rawData = await response.json();
        
        if (rawData.error) {
          throw new Error("Lỗi Apps Script: " + rawData.error);
        }
        
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("weekInfoCard").style.display = "flex";
        
        updateBadgeTime();
        
        renderTab();
      } catch (error) {
        console.error(error);
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("errorState").style.display = "flex";
        document.getElementById("errorMsg").textContent = error.message;
      }
    }

    function updateBadgeTime() {
      if (!rawData) return;
      const time = currentActiveTab === "thisWeek" ? rawData.thisWeekUpdated : rawData.lastWeekUpdated;
      const badge = document.getElementById("updateBadge");
      badge.innerHTML = time ? `<i class="fas fa-hourglass-half"></i> Cập nhật: ${time}` : "";
    }

    function switchTab(tab) {
      if (currentActiveTab === tab) return;
      currentActiveTab = tab;
      
      // Update UI active states
      document.getElementById("tabThisWeek").classList.toggle("active", tab === 'thisWeek');
      document.getElementById("tabLastWeek").classList.toggle("active", tab === 'lastWeek');
      
      updateBadgeTime();
      renderTab();
    }

    function renderTab() {
      if (!rawData) return;
      
      const tableContainer = document.getElementById("leaderboardTableContainer");
      tableContainer.innerHTML = "";
      
      const listData = currentActiveTab === "thisWeek" ? rawData.thisWeek : rawData.lastWeek;
      const weekHeader = currentActiveTab === "thisWeek" ? rawData.thisWeekHeader : rawData.lastWeekHeader;
      
      // Update week label header
      document.getElementById("weekHeaderLabel").textContent = weekHeader || "Bảng xếp hạng";
      
      if (!listData || listData.length === 0) {
        tableContainer.innerHTML = `
          <div class="state-container">
            <i class="fas fa-running" style="font-size: 40px; color: var(--text-muted); margin-bottom: 10px;"></i>
            <p style="color: var(--text-secondary);">Chưa có dữ liệu vận động viên cho tuần này.</p>
          </div>`;
        return;
      }
      
      filterLeaderboard();
    }

    function filterLeaderboard() {
      if (!rawData) return;
      
      const tableContainer = document.getElementById("leaderboardTableContainer");
      let listData = currentActiveTab === "thisWeek" ? rawData.thisWeek : rawData.lastWeek;
      
      // Sắp xếp: có đăng ký (regKm > 0) lên trên, không đăng ký xuống dưới; mỗi nhóm theo tên A-Z
      listData = [...listData].sort((a, b) => {
        const aReg = a.regKm > 0 ? 0 : 1;
        const bReg = b.regKm > 0 ? 0 : 1;
        if (aReg !== bReg) return aReg - bReg;
        return a.name.localeCompare(b.name, 'vi');
      });
      
      // Lọc các runner thực tế có chạy (actKm > 0)
      const renderedRunners = listData.filter(runner => runner.actKm > 0);
      
      if (renderedRunners.length === 0) {
        tableContainer.innerHTML = `
          <div class="state-container">
            <i class="fas fa-search" style="font-size: 30px; color: var(--text-muted); margin-bottom: 10px;"></i>
            <p style="color: var(--text-secondary);">Không tìm thấy runner nào có hoạt động.</p>
          </div>`;
        return;
      }

      const currentYear = new Date().getFullYear();
      const weekHeader = currentActiveTab === "thisWeek" ? rawData.thisWeekHeader : rawData.lastWeekHeader;
      
      // Helper function to format KM values exactly like in Google Sheet (with comma separator)
      const formatKm = (val) => {
        if (val === null || val === undefined || val === 0) return "";
        return val % 1 === 0 ? val.toString() : val.toFixed(1).replace('.', ',');
      };

      let tableHtml = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th rowspan="2" class="header-strava">Strava</th>
              <th colspan="2" class="header-week">${weekHeader || "Bảng xếp hạng"}</th>
            </tr>
            <tr>
              <th class="subheader-reg">Đăng ký<br><span class="unit">(km)</span></th>
              <th class="subheader-act">thực tế<br><span class="unit">(km)</span> <span class="filter-icon"><i class="fas fa-filter"></i></span></th>
            </tr>
          </thead>
          <tbody>
      `;

      renderedRunners.forEach((runner, index) => {
        let rowClass = "row-no-goal";
        
        if (runner.regKm > 0) {
          if (runner.actKm >= runner.regKm) {
            rowClass = "row-goal-met";
          } else {
            rowClass = "row-goal-failed";
          }
        }
        
        // Hiển thị ghi chú phạt nuôi heo ở tuần trước
        let fineHtml = "";
        if (currentActiveTab === "lastWeek" && runner.note) {
          let noteText = runner.note;
          if (/^\d+$/.test(noteText)) {
            noteText = Number(noteText).toLocaleString('vi-VN');
          }
          if (!noteText.toLowerCase().endsWith("vnđ") && !noteText.toLowerCase().endsWith("vnd") && !noteText.endsWith("đ") && !noteText.toLowerCase().endsWith("k")) {
            noteText += " VNĐ";
          } else if (noteText.endsWith("đ") || noteText.toLowerCase().endsWith("d")) {
            noteText = noteText.replace(/d|đ$/i, " VNĐ");
          }
          fineHtml = `<span class="table-fine-badge"><i class="fas fa-piggy-bank"></i> nuôi heo ${noteText}</span>`;
        }

        tableHtml += `
          <tr class="${rowClass}">
            <td class="runner-name-cell">
              <span class="runner-name-text">${runner.name}</span>
              ${fineHtml}
            </td>
            <td class="runner-reg-cell">${formatKm(runner.regKm)}</td>
            <td class="runner-act-cell">${formatKm(runner.actKm)}</td>
          </tr>
        `;
      });

      tableHtml += `
          </tbody>
        </table>
      `;

      tableContainer.innerHTML = tableHtml;
    }
  </script>
</body>
</html>
